[workspace]
resolver = "2"
members = [
    "crates/strixonomy",
    "crates/strixonomy-core",
    "crates/strixonomy-parser",
    "crates/strixonomy-owl",
    "crates/strixonomy-obo",
    "crates/strixonomy-catalog",
    "crates/strixonomy-diagnostics",
    "crates/strixonomy-query",
    "crates/strixonomy-reasoner",
    "crates/strixonomy-robot",
    "crates/strixonomy-refactor",
    "crates/strixonomy-diff",
    "crates/strixonomy-docs",
    "crates/strixonomy-edit",
    "crates/strixonomy-cli",
    "crates/strixonomy-lsp",
    "crates/strixonomy-plugin",
    "crates/strixonomy-plugin-naming",
    "crates/strixonomy-plugin-markdown-export",
    "crates/strixonomy-plugin-shacl",
    "crates/strixonomy-plugin-builtins",
    "crates/strixonomy-swrl",
]
default-members = ["crates/strixonomy-cli"]

# Unpublished workspace shell: integration tests and examples only.
# `cargo run --` runs the `strixonomy` CLI (default-member), not this package as a library.
# Package name must not collide with the published façade crate `strixonomy`.
[package]
name = "strixonomy-workspace"
version = "0.28.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
strixonomy = { workspace = true }

[[example]]
name = "index_and_query"
path = "examples/index_and_query.rs"

[[example]]
name = "error_handling"
path = "examples/error_handling.rs"

[[example]]
name = "strixonomy_workspace"
path = "examples/strixonomy_workspace.rs"

[[example]]
name = "semantic_diff"
path = "examples/semantic_diff.rs"

[[example]]
name = "workspace_operations"
path = "examples/workspace_operations.rs"

[dev-dependencies]
strixonomy = { workspace = true }
strixonomy-catalog = { workspace = true }
strixonomy-core = { workspace = true }
strixonomy-parser = { workspace = true }
strixonomy-query = { workspace = true }
strixonomy-lsp = { workspace = true }
strixonomy-reasoner = { workspace = true }
strixonomy-owl = { workspace = true }
strixonomy-obo = { workspace = true }
strixonomy-swrl = { workspace = true }
strixonomy-plugin = { workspace = true }
strixonomy-plugin-builtins = { workspace = true }
strixonomy-refactor = { workspace = true }
strixonomy-edit = { workspace = true }
serde_json.workspace = true
fastobo.workspace = true
regex = "1"
tempfile = "3"

[workspace.package]
version = "0.28.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eddiethedean/strixonomy"
homepage = "https://github.com/eddiethedean/strixonomy"
authors = ["Strixonomy Contributors"]
keywords = ["ontology", "owl", "rdf", "sparql", "turtle"]
categories = ["command-line-utilities", "science", "parser-implementations"]

[workspace.dependencies]
strixonomy = { path = "crates/strixonomy", version = "0.28.1" }
strixonomy-core = { path = "crates/strixonomy-core", version = "0.28.1" }
strixonomy-parser = { path = "crates/strixonomy-parser", version = "0.28.1" }
strixonomy-owl = { path = "crates/strixonomy-owl", version = "0.28.1" }
strixonomy-obo = { path = "crates/strixonomy-obo", version = "0.28.1" }
strixonomy-catalog = { path = "crates/strixonomy-catalog", version = "0.28.1" }
strixonomy-diagnostics = { path = "crates/strixonomy-diagnostics", version = "0.28.1" }
strixonomy-query = { path = "crates/strixonomy-query", version = "0.28.1" }
strixonomy-lsp = { path = "crates/strixonomy-lsp", version = "0.28.1" }
strixonomy-reasoner = { path = "crates/strixonomy-reasoner", version = "0.28.1" }
strixonomy-robot = { path = "crates/strixonomy-robot", version = "0.28.1" }
strixonomy-refactor = { path = "crates/strixonomy-refactor", version = "0.28.1" }
strixonomy-diff = { path = "crates/strixonomy-diff", version = "0.28.1" }
strixonomy-docs = { path = "crates/strixonomy-docs", version = "0.28.1" }
strixonomy-plugin = { path = "crates/strixonomy-plugin", version = "0.28.1" }
strixonomy-plugin-naming = { path = "crates/strixonomy-plugin-naming", version = "0.28.1" }
strixonomy-plugin-markdown-export = { path = "crates/strixonomy-plugin-markdown-export", version = "0.28.1" }
strixonomy-plugin-shacl = { path = "crates/strixonomy-plugin-shacl", version = "0.28.1" }
strixonomy-edit = { path = "crates/strixonomy-edit", version = "0.28.1" }
strixonomy-plugin-builtins = { path = "crates/strixonomy-plugin-builtins", version = "0.28.1" }
strixonomy-swrl = { path = "crates/strixonomy-swrl", version = "0.28.1" }

git2 = { version = "0.20", features = ["vendored-openssl"] }

ontologos-core = "1.1.4"
ontologos-parser = "1.1.4"
ontologos-profile = "1.1.4"
ontologos-el = "1.1.4"
ontologos-rl = "1.1.4"
ontologos-dl = "1.1.4"
ontologos-facade = "1.1.4"
ontologos-explain = "1.1.4"
ontologos-bridge = "1.1.4"
ontologos-swrl = "1.1.4"

lsp-server = "0.7"
lsp-types = "0.97"
url = "2"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
ignore = "0.4"
oxigraph = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = "0.10"
sqlparser = "0.53"
thiserror = "2"
horned-owl = "1.4"
fastobo = "0.15"
fastobo-owl = "0.3"
fastobo-validator = "0.4"
petgraph = "0.8"
minijinja = "2"
pulldown-cmark = "0.13"

[profile.release]
lto = true
codegen-units = 1
