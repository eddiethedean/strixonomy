[package]
name = "strixonomy-diagnostics"
description = "Ontology lint rules and diagnostic collection for Strixonomy (strixonomy-*)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE-2.0"]

[dependencies]
strixonomy-core = { workspace = true }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
