[package]
name = "strixonomy-lsp"
description = "Language server for Strixonomy (strixonomy-lsp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE-2.0"]
default-run = "strixonomy-lsp"

[lib]
name = "strixonomy_lsp"
path = "src/lib.rs"

[[bin]]
name = "strixonomy-lsp"
path = "src/main.rs"

[[bin]]
name = "ontocore-lsp"
path = "src/main.rs"

[dependencies]
strixonomy-catalog = { workspace = true }
strixonomy-core = { workspace = true }
strixonomy-edit = { workspace = true }
strixonomy-owl = { workspace = true }
strixonomy-obo = { workspace = true }
strixonomy-query = { workspace = true }
strixonomy-reasoner = { workspace = true }
strixonomy-refactor = { workspace = true }
strixonomy-swrl = { workspace = true }
strixonomy-robot = { workspace = true }
strixonomy-diff = { workspace = true }
strixonomy-plugin-builtins = { workspace = true }
strixonomy-plugin = { workspace = true }
lsp-server.workspace = true
lsp-types.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url.workspace = true
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
