[package]
name = "strixonomy"
description = "Strixonomy — semantic workspace engine for ontology development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE-2.0"]

[features]
default = []
lsp = ["dep:strixonomy-lsp"]
plugins = ["dep:strixonomy-plugin"]

[dependencies]
strixonomy-catalog = { workspace = true }
strixonomy-core = { workspace = true }
strixonomy-diagnostics = { workspace = true }
strixonomy-diff = { workspace = true }
strixonomy-docs = { workspace = true }
strixonomy-edit = { workspace = true }
strixonomy-lsp = { workspace = true, optional = true }
strixonomy-plugin = { workspace = true, optional = true }
strixonomy-owl = { workspace = true }
strixonomy-obo = { workspace = true }
strixonomy-parser = { workspace = true }
strixonomy-query = { workspace = true }
strixonomy-reasoner = { workspace = true }
strixonomy-refactor = { workspace = true }
strixonomy-swrl = { workspace = true }
thiserror = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tempfile = "3"
strixonomy-plugin = { workspace = true }
