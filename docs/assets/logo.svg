<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Strixonomy owl and knowledge graph">
  <defs>
    <linearGradient id="night" x1="14" y1="8" x2="108" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312e81"/>
      <stop offset=".52" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b0a22"/>
    </linearGradient>
    <linearGradient id="iris" x1="36" y1="38" x2="82" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f3a712"/>
    </linearGradient>
    <linearGradient id="feather" x1="28" y1="28" x2="86" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#night)"/>
  <path d="M17 0h77c14.4 0 26 11.6 26 26v68c0 14.4-11.6 26-26 26H79C48 94 27 55 17 0Z" fill="#fff" opacity=".025"/>

  <!-- A single, symmetrical silhouette stays legible at favicon size. -->
