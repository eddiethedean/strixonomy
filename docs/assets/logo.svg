  <path d="M23 47c9-14 23-18 37-8 14-10 28-6 37 8-4 21-17 37-37 47-20-10-33-26-37-47Z" fill="#a5b4fc"/>

  <!-- Brow and eye mask form an abstract W for wisdom/workspace. -->
  <path d="M27 47c9-11 22-14 33-5 11-9 24-6 33 5-5 17-17 26-33 27-16-1-28-10-33-27Z" fill="#262262"/>
  <path d="m31 40 29 12 29-12-12 24-17 10-17-10-12-24Z" fill="#312e81" opacity=".72"/>

  <circle cx="42.5" cy="51" r="12.5" fill="url(#iris)"/>
  <circle cx="77.5" cy="51" r="12.5" fill="url(#iris)"/>
  <circle cx="42.5" cy="51" r="5.5" fill="#0b0a22"/>
  <circle cx="77.5" cy="51" r="5.5" fill="#0b0a22"/>
  <circle cx="39.5" cy="47.5" r="2" fill="#fff" opacity=".92"/>
  <circle cx="74.5" cy="47.5" r="2" fill="#fff" opacity=".92"/>
  <path d="m60 57 8 8-8 7-8-7 8-8Z" fill="#f3a712"/>

  <!-- Three connected nodes turn the owl's breast into a knowledge graph. -->
  <path d="M38 82h44M38 82l22 14 22-14" fill="none" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="82" r="5" fill="#4f46e5" stroke="#eef2ff" stroke-width="2"/>
  <circle cx="60" cy="96" r="5" fill="#f3a712" stroke="#fff7db" stroke-width="2"/>
  <circle cx="82" cy="82" r="5" fill="#4f46e5" stroke="#eef2ff" stroke-width="2"/>
</svg>
